# 一键起全套：make demo-db && docker compose up --build
#   服务网页    http://localhost:8000
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000  (admin / admin，已预配数据源与大盘)
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # 容器内用 subprocess 执行图表代码：app 容器本身就是隔离边界
      CHART_EXECUTOR: subprocess
      DB_PATH: data/demo/ecommerce.sqlite
    volumes:
      - app-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  app-data:
